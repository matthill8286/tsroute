name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy, rustfmt }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test            # CI=true, so the example fails if the TS is stale
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Typecheck and e2e the generated client
        working-directory: examples/todo-api
        run: |
          cargo build
          (ADDR=127.0.0.1:3000 ../../target/debug/todo-api &)
          cd web && npm ci && npm run typecheck
          for i in $(seq 1 30); do curl -sf localhost:3000/health && break; sleep 1; done
          npm run e2e
