name: Release
# Push a tag like v0.1.0 to publish both crates to crates.io.
on:
  push:
    tags: ["v*"]
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
        env: { CI: "true" }
      # Publishes tsroute-macros, then tsroute (the example crate has publish = false).
      - run: cargo publish --workspace --exclude todo-api
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
